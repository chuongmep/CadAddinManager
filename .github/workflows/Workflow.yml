name: Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '!master'

jobs:
  windows:
    name: windows-2025-vs2026
    runs-on: windows-2025-vs2026
    steps:
            # 6. Install Visual Studio 2026 Build Tools
      - name: Checkout
        uses: actions/checkout@v1
      - name: Run Nuke Build
        run: ./.nuke/build.cmd --GitHubToken ${{ secrets.GITHUB_TOKEN }}
