name: Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '!master'

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Install Nuke
        run: dotnet tool install Nuke.GlobalTool --global
      - name: Run Nuke Build
        run: ./.nuke/build.cmd --GitHubToken ${{ secrets.GITHUB_TOKEN }}